<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f4f8;
        }

        header {
            background: #1677ff;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            padding: 25px;
            max-width: 900px;
            margin: auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

    <header>

        <h1>د انستیتیوت مدیریت سیستم</h1>

    </header>

    <div class="container">

        <div class="welcome">

            <h2>ښه راغلاست مدیر صاحب 👋</h2>

            <p>
                د انستیتیوت Dashboard ته ښه راغلاست.
            </p>

        </div>

        <div class="menu">

            <div class="card">
                👨‍🎓
                <br><br>
                محصلین
            </div>

            <div class="card">
                📅
                <br><br>
                حاضري
            </div>

            <div class="card">
                💰
                <br><br>
                فیسونه
            </div>

            <div class="card">
                📊
                <br><br>
                راپورونه
            </div>

        </div>

    </div>

</body>

</html>
