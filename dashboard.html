<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>د انستیتیوت د محصلینو سیستم</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            width: 320px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            font-size: 23px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>د انستیتیوت د محصلینو سیستم</h1>

    <h2>Login</h2>

    <label>د کارن نوم</label>

    <input
        type="text"
        id="username"
        placeholder="admin"
    >

    <label>پټ نوم</label>

    <input
        type="password"
        id="password"
        placeholder="12345"
    >

    <button onclick="login()">Login</button>

    <p id="message"></p>

</div>


<script>

function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (username === "admin" && password === "12345") {

        document.getElementById("message").innerHTML =
            "Login بریالی شو ✅";

        document.getElementById("message").style.color = "green";

        setTimeout(function() {
            window.location.href = "dashboard.html";
        }, 500);

    } else {

        document.getElementById("message").innerHTML =
            "کارن نوم یا پټ نوم غلط دی ❌";

        document.getElementById("message").style.color = "red";
    }

}

</script>

</body>

</html>
