<!DOCTYPE html>
<html lang="ps" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>د انستیتیوت د محصلینو سیستم</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: right;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1677ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #095dcc;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>د انستیتیوت د محصلینو سیستم</h1>

        <label for="username">د کارن نوم:</label>

        <input
            type="text"
            id="username"
            placeholder="کارن نوم ولیکئ"
        >

        <label for="password">پټ نوم:</label>

        <input
            type="password"
            id="password"
            placeholder="پټ نوم ولیکئ"
        >

        <button onclick="login()">Login</button>

        <p id="message"></p>

    </div>


    <script>

        function login() {

            document.getElementById("message").innerHTML =
                "Login بریالی شو ✅";

            document.getElementById("message").style.color =
                "green";

            setTimeout(function () {

                window.location.href = "dashboard.html";

            }, 500);
        }

    </script>

</body>

</html>
